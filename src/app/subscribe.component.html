<main class="subscribe-page">
  <header class="subscribe-header"><a class="subscribe-brand" href="/"><span class="brand-mark">S</span>ScoreFit</a><a class="close-button" href="/" aria-label="Close">×</a></header>
  <section class="subscribe-shell">
    <div class="subscribe-card">
      <div class="pass-badge">✥ &nbsp; JOB SEARCH PASS</div>
      <div class="card-brand"><span class="brand-mark">S</span>ScoreFit</div>
      <h1>Sign in to subscribe</h1>
      <p class="intro">Create an account or sign in to activate your Job Search Pass <strong>(₹1,999/month)</strong>.</p>
      <button class="google-button" type="button"><span class="google-g">G</span>Continue with Google</button>
      <div class="divider"><span>OR</span></div>
      <label class="email-label" for="email">Email address</label>
      <div class="email-field"><input id="email" name="email" type="email" [(ngModel)]="email" placeholder="you&#64;example.com" autocomplete="email" /><span>＠</span></div>
      <button class="email-button" type="button">Continue with email <span>→</span></button>
      <p class="terms">By continuing, you agree to ScoreFit’s <a href="#terms">Terms of Service</a> and <a href="#privacy">Privacy Policy</a>.</p>
    </div>
  </section>
  <footer class="subscribe-footer"><a href="/">▦<small>Overview</small></a><a href="/score-result">▤<small>Audit</small></a><a href="/score-result">◎<small>Matches</small></a><a class="selected" href="/subscribe">◉<small>Profile</small></a></footer>
</main>
